name: ci-cd
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read, packages: write}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Safety evaluation gate (fails on any unsafe ELIGIBLE / false positive / ungrounded claim)
        run: python -m app.evaluation
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt || true
  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v5
        with: {push: true, tags: "ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest"}
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with: {image-ref: "ghcr.io/${{ github.repository }}:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "0"}
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Deploy (kubeconfig stored as secret)
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl -n trialmatch set image deploy/trialmatch-api api=ghcr.io/${{ github.repository }}:${{ github.sha }}
          kubectl -n trialmatch rollout status deploy/trialmatch-api --timeout=180s
