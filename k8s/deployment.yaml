apiVersion: v1
kind: Namespace
metadata: {name: trialmatch}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trialmatch-api, namespace: trialmatch}
spec:
  replicas: 3
  selector: {matchLabels: {app: trialmatch-api}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata:
      labels: {app: trialmatch-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8000"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: ghcr.io/YOUR_ORG/trialmatch:latest
        ports: [{containerPort: 8000}]
        envFrom: [{secretRef: {name: trialmatch-secrets}}]     # DATABASE_URL, REDIS_URL, JWT_SECRET, DATA_KEY, *_PASSWORD
        env: [{name: ENV, value: production}]
        readinessProbe: {httpGet: {path: /ready, port: 8000}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10}
        resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: trialmatch-api, namespace: trialmatch}
spec: {selector: {app: trialmatch-api}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: trialmatch-api, namespace: trialmatch}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: trialmatch-api}
  minReplicas: 3
  maxReplicas: 20
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: trialmatch-api, namespace: trialmatch}
spec: {minAvailable: 2, selector: {matchLabels: {app: trialmatch-api}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trialmatch
  namespace: trialmatch
  annotations: {cert-manager.io/cluster-issuer: letsencrypt, nginx.ingress.kubernetes.io/ssl-redirect: "true"}
spec:
  ingressClassName: nginx
  tls: [{hosts: [trialmatch.example.com], secretName: trialmatch-tls}]
  rules:
  - host: trialmatch.example.com
    http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: trialmatch-api, port: {number: 80}}}}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-egress-except-data, namespace: trialmatch}
spec:
  podSelector: {matchLabels: {app: trialmatch-api}}
  policyTypes: [Egress]
  egress:
  - to: [{namespaceSelector: {}}]
    ports: [{port: 5432}, {port: 6379}, {port: 53, protocol: UDP}]
